[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/seomun-core
command=php artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/seomun-core/storage/logs/worker.log
stopwaitsecs=3600

[program:laravel-export-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/seomun-core
command=php artisan queue:work --queue=export --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/seomun-core/storage/logs/export-worker.log
stopwaitsecs=3600
